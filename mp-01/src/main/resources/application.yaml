# 仅仅配置数据源
spring:
  application:
    name: mp-01
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mybatis-plus
    username: root
    password: 123456

# MP的配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: false
  # 设置主键生成策略的全局配置为AUTO，默认值是：ASSIGN_ID
  global-config:
    db-config:
      id-type: auto
      update-strategy: not_null # 不为null时更新，更新字段的策略。
  type-aliases-package: com.ittxf.mp.entity
  mapper-locations:
    # - classpath*:/mapper/**/*.xml
    - classpath:/mapper/*.xml