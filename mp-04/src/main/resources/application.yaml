spring:
  application:
    name: mp-04
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mybatis-plus?rewriteBatchedStatements=true
    username: root
    password: 123456

# MP的配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: true
    # 专门处理 java的枚举类型 与 数据库表字段 之间转换的
    # 默认的枚举类型处理器，这种处理器是可以自己定制的。
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      id-type: auto
      update-strategy: not_null
      logic-delete-field: deleted  # 全局逻辑删除字段名
      logic-delete-value: 1 # 逻辑删除值
      logic-not-delete-value: 0 # 逻辑未删除值
  type-aliases-package: com.ittxf.mp.entity
  mapper-locations:
    - classpath:/mapper/*.xml

# 以下配置是swagger的配置
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
knife4j:
  enable: true
  group:
    default:
      group-name: default
      api-rule: package
      api-rule-resources:
        - com.ittxf\.mp.controller